name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: joycode-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: joycode-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: joycode-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin joycode

      - name: Prepare asset
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/joycode"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          cp "$bin" "${{ matrix.asset }}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
