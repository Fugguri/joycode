[package]
name = "joycode"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "joycode"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/probe.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"

# Linux-only: виртуальная клавиатура через uinput.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

# Не-Linux (Windows/macOS/BSD): впрыск через enigo.
[target.'cfg(not(target_os = "linux"))'.dependencies]
enigo = "0.3"
