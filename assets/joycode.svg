<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242833"/>
      <stop offset="1" stop-color="#12141A"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9ECF1"/>
      <stop offset="1" stop-color="#C4C9D2"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- фон-плитка -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="50" fill="none" stroke="#E8A33C" stroke-opacity="0.16" stroke-width="2"/>

  <!-- геймпад -->
  <g filter="url(#sh)" transform="translate(0,6)">
    <circle cx="80" cy="150" r="34" fill="url(#pad)"/>
    <circle cx="176" cy="150" r="34" fill="url(#pad)"/>
    <rect x="46" y="92" width="164" height="60" rx="30" fill="url(#pad)"/>

    <!-- крестовина (слева) — янтарная -->
    <g fill="#E8A33C">
      <rect x="76" y="112" width="12" height="34" rx="3"/>
      <rect x="65" y="123" width="34" height="12" rx="3"/>
    </g>

    <!-- кнопки (справа) — янтарные -->
    <g fill="#E8A33C">
      <circle cx="180" cy="118" r="8"/>
      <circle cx="180" cy="142" r="8"/>
      <circle cx="168" cy="130" r="8"/>
      <circle cx="192" cy="130" r="8"/>
    </g>

    <!-- экран-терминал по центру -->
    <rect x="106" y="112" width="44" height="30" rx="7" fill="#0E1014"/>
    <text x="128" y="133" font-family="monospace" font-size="18" font-weight="700"
          fill="#E8A33C" text-anchor="middle">&gt;_</text>
  </g>
</svg>
